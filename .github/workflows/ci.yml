name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # go:embed all:frontend/dist 要求 dist 先存在（dist 不入库）：
      # 先构建前端再跑 Go 测试
      - name: Build frontend dist
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Go vet + test
        run: go vet ./... && go test ./...
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  test-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend dist
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Go test -race
        run: go test -race ./...
